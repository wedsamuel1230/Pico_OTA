paragraph=Provides Over-The-Air updates for Pico W and Pico 2 W (Arduino-Pico core). Supports ArduinoOTA, HTTP pull-based OTA, web browser uploads, and GitHub release auto-updates. Select a Flash Size that includes LittleFS (for example, Pico W Sketch: 1MB, FS: 1MB or Pico 2 W Sketch: 2MB, FS: 2MB). ESP32 is supported with the same API.
